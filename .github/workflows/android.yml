name: Build Keefy TV for Android only
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Generate Android project
        run: flutter create --platforms=android --org com.keefytv .
      - name: Install required Android platform
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          app_gradle = next((p for p in candidates if p.exists()), None)
          if app_gradle is None:
              raise SystemExit("Android app Gradle file was not generated")
          s = app_gradle.read_text()
          s = re.sub(r"compileSdk\\s*=\\s*flutter\\.compileSdkVersion", "compileSdk = 36", s)
          s = re.sub(r"compileSdkVersion\\s+flutter\\.compileSdkVersion", "compileSdkVersion 36", s)
          if "compileSdk = 36" not in s and "compileSdkVersion 36" not in s:
              raise SystemExit("Could not set app compileSdk to 36")
          app_gradle.write_text(s)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Align Flutter plugin Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          if not cache.exists():
              raise SystemExit(f"Pub cache not found: {cache}")
          changed = []
          for package in cache.iterdir():
              android_dir = package / "android"
              if not android_dir.is_dir():
                  continue
              for gradle_file in android_dir.rglob("build.gradle*"):
                  try:
                      source = gradle_file.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated = re.sub(
                      r"compileSdk\\s*=\\s*flutter\\.compileSdkVersion",
                      "compileSdk = 36",
                      source
                  )
                  updated = re.sub(
                      r"compileSdkVersion\\s+flutter\\.compileSdkVersion",
                      "compileSdkVersion 36",
                      updated
                  )
                  updated = re.sub(r"compileSdk\\s*=\\s*34\\b", "compileSdk = 36", updated)
                  updated = re.sub(r"compileSdkVersion\\s+34\\b", "compileSdkVersion 36", updated)
                  if updated != source:
                      gradle_file.write_text(updated)
                      changed.append(str(gradle_file))
          print(f"Aligned Android compileSdk in {len(changed)} Flutter plugin Gradle files")
          for item in changed:
              print(item)
          PY
      - name: Configure Android network access
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(p)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          permission = "android.permission.INTERNET"
          if not any(e.get(android + "name") == permission for e in root.findall("uses-permission")):
              ET.SubElement(root, "uses-permission", {android + "name": permission})
          app = root.find("application")
          if app is None:
              raise SystemExit("Android application element missing")
          app.set(android + "usesCleartextTraffic", "true")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree.write(p, encoding="utf-8", xml_declaration=True)
          PY
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: keefy-tv-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
