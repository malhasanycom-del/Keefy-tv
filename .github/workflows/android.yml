name: Build Keefy TV APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.keefytv .
      - name: Configure Android SDK compatibility
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              s = p.read_text()
              s = s.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              p.write_text(s)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Configure Android network access
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: keefy-tv-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
